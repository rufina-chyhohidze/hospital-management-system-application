<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospitals</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src ="/static/js/search-hospitals.js" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">


    <link rel="stylesheet" th:href="@{/static/style.css}" href="/static/style.css">
    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
    <link rel="icon" href="/static/favicon/favicon.ico">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Main Content -->
<section class="intro">
    <div class="bg-image h-100" style="background-image: url('https://mdbootstrap.com/img/Photos/new-templates/tables/img2.jpg');">
        <div class="mask d-flex align-items-center h-100" style="background-color: rgba(0,0,0,.25);">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12">
                        <div class="card bg-dark shadow-2-strong">
                            <div class="card-body">
                                <h1 class="mb-4 text-white">All Hospitals</h1>
                                <div class="mb-4">
                                    <input type="text" id="searchTerm" class="form-control" placeholder="Search" aria-label="Search hospitals by name or address">
                                </div>
                                <a href="/hospitals/add" class="btn btn-primary mb-3">Add New Hospital</a>

                                <div class="table-responsive">
                                    <table class="table table-dark table-borderless mb-0">
                                        <thead>
                                        <tr>
                                            <th>Hospital Name</th>
                                            <th>Address</th>
                                            <th>Established Date</th>
                                            <th>Departments</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="hospital : ${hospitals}" th:data-hospital-id="${hospital.id}">
                                            <td th:text="${hospital.hospitalName}">Hospital Name</td>
                                            <td th:text="${hospital.hospitalAddress}">Address</td>
                                            <td th:text="${hospital.establishedDate}">Established Date</td>
                                            <td>
                                              <span th:each="department, iterStat : ${hospital.departments}">
                                                  <span th:text="${department}"></span>
                                                  <span th:if="${!iterStat.last}">, </span>
                                              </span>
                                            </td>
                                        </tr>
                                        </tbody>
                                        <tbody>


                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
