<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
  <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"
          src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
  <link rel="stylesheet" href="/static/style.css"
        th:href="@{/static/style.css}">
  <link rel="icon" href="/static/favicon/favicon.ico">
 <link rel="stylesheet" href="/static/login.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="vh-100">
  <div class="container-fluid h-custom">
    <div class="row d-flex justify-content-center align-items-center h-100">

      <!-- Left Side Image -->
      <div class="col-md-9 col-lg-6 col-xl-5">
        <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fstatic.vecteezy.com%2Fsystem%2Fresources%2Fpreviews%2F024%2F585%2F344%2Foriginal%2F3d-happy-cartoon-doctor-cartoon-doctor-on-transparent-background-generative-ai-png.png&f=1&nofb=1&ipt=9b1c1908a90f03a73f46a3255ba29570009a28d82d5bde0f88e3f81f0ccf93bf&ipo=images"
             class="img-fluid" alt="Sample image">
      </div>

      <!-- Right Side Form -->
      <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
        <form th:action="@{/login}" method="post">

          <!-- Title -->
          <h3 class="fw-bold mb-4 text-center">Login</h3>

          <!-- Username -->
          <div class="form-outline mb-4">
            <input type="text" name="username" class="form-control form-control-lg" placeholder="Username" required/>
          </div>

          <!-- Password -->
          <div class="form-outline mb-3">
            <input type="password" name="password" class="form-control form-control-lg" placeholder="Password" required/>
          </div>

          <!-- Error Message -->
          <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Invalid username or password.
          </div>

          <!-- Remember Me and Forgot Password -->
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="" id="rememberMe">
              <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            <a href="#" class="text-body">Forgot password?</a>
          </div>

          <!-- Submit Button -->
          <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
          </div>

          <!-- Register Link -->
          <p class="small fw-bold mt-3 mb-2 text-center">Don't have an account?
            <a th:href="@{/register}" class="link-danger">Register</a>
          </p>

        </form>
      </div>
    </div>
  </div>

  <!-- Footer -->

    <div>
      <a href="#" class="text-white me-4"><i class="fab fa-facebook-f"></i></a>
      <a href="#" class="text-white me-4"><i class="fab fa-twitter"></i></a>
      <a href="#" class="text-white me-4"><i class="fab fa-google"></i></a>
      <a href="#" class="text-white"><i class="fab fa-linkedin-in"></i></a>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
