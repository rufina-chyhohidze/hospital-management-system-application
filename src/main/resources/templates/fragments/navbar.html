
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navbar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/navbar.css">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<div th:fragment="navbar">
    <div class="container-fluid px-0">
        <nav class="navbar navbar-expand-sm navbar-dark bg-black py-0 px-0">
            <a class="navbar-brand" href="/">Hospital App</a>
            <span class="v-line"></span>
            <button class="navbar-toggler mr-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item active">
                        <a class="nav-link" href="/patients" th:text="#{navbar.patients}">All Patients</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/doctors" th:text="#{navbar.doctors}">All Doctors</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/patients/add" th:text="#{navbar.addPatient}">Add Patient</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/doctors/add" th:text="#{navbar.addDoctor}">Add Doctor</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/session-history" th:text="#{navbar.session}">Session History</a>
                    </li>
                </ul>
            </div>
        </nav>
    </div>
</div>
</body>
</html>
