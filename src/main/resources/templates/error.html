<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
  <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"
          src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" th:href="@{/static/style.css}" href="/static/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
    <link rel="icon" href="/static/favicon/favicon.ico">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">
  <div class="alert alert-danger text-center">
    <h1 class="display-4"><i class="bi bi-exclamation-triangle-fill"></i> Oops! Something went wrong</h1>
    <p class="lead" th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred. Please try again later.'}"></p>
    <a href="/" class="btn btn-primary mt-3"><i class="bi bi-house"></i> Go Home</a>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
