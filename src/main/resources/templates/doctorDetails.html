<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Details</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/static/style.css}" href="/static/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
    <link rel="icon" href="/static/favicon/favicon.ico">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h1 class="mb-4">Doctor Details</h1>

    <div class="card mb-4">
        <div class="row g-0">
            <div class="col-md-4">
                <!-- placeholder for future picture -->
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <h5 class="card-title" th:text="${doctor.firstName} + ' ' + ${doctor.lastName}"></h5>
                    <p class="card-text"><strong>License Number:</strong> <span th:text="${doctor.licenseNumber}"></span></p>
                    <p class="card-text"><strong>Department:</strong> <span th:text="${doctor.department}"></span></p>
                    <p><strong>Hospital:</strong> <span th:text="${doctor.hospital.hospitalName}"></span></p>
                    <p class="card-text"><strong>Salary:</strong> <span th:text="${doctor.salary}"></span></p>
                    <p class="card-text"><strong>Hire Date:</strong> <span th:text="${doctor.hireDate}"></span></p>
                    <p class="card-text"><strong>Gender:</strong> <span th:text="${doctor.gender}"></span></p>
                    <h3>Assigned Patients</h3>
                    <ul>
                        <li th:each="patient : ${assignedPatients}">
                            <a th:href="@{/patients/{patientId}(patientId=${patient.patientId})}" th:text="${patient.firstName} + ' ' + ${patient.lastName}"></a>
                        </li>
                    </ul>
                    <a th:href="@{/doctors}" class="btn btn-primary">Back to Doctors</a>
                </div>
            </div>
        </div>
    </div>
</div>

<h2>Add Medical Record</h2>
<form th:action="@{/doctors/{doctorId}/add-medical-record(doctorId=${doctor.licenseNumber})}" method="post">
    <div class="form-group">
        <label for="patientId">Select Patient</label>
        <select id="patientId" name="patientId" class="form-select" required>
            <option value="" disabled selected>Select a patient</option>
            <option th:each="patient : ${allPatients}" th:value="${patient.patientId}"
                    th:text="${patient.firstName} + ' ' + ${patient.lastName}"></option>
        </select>
    </div>

    <div class="form-group">
        <label for="diagnosis">Diagnosis</label>
        <input type="text" id="diagnosis" name="diagnosis" class="form-control" required />
    </div>

    <div class="form-group">
        <label for="treatment">Treatment</label>
        <input type="text" id="treatment" name="treatment" class="form-control" required />
    </div>

    <div class="form-group">
        <label for="treatmentDate">Treatment Date</label>
        <input type="date" id="treatmentDate" name="treatmentDate" class="form-control" required />
    </div>

    <button type="submit" class="btn btn-success mt-3">Add Medical Record</button>
</form>


<h2>Medical Records</h2>
<table class="table table-bordered">
    <thead>
    <tr>
        <th>Patient</th>
        <th>Diagnosis</th>
        <th>Treatment</th>
        <th>Date</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="record : ${medicalRecords}">
        <td th:text="${record.patient.firstName} + ' ' + ${record.patient.lastName}"></td>
        <td th:text="${record.diagnosis}"></td>
        <td th:text="${record.treatment}"></td>
        <td th:text="${record.treatmentDate}"></td>
    </tr>
    </tbody>
</table>



<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
