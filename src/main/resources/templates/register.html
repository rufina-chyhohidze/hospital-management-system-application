<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
  <link rel="stylesheet" href="/static/style.css"
        th:href="@{/static/style.css}">
  <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"
          src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
  <link rel="icon" href="/static/favicon/favicon.ico">
  <script src ="/static/js/register.js" defer></script>
  <link rel="stylesheet" href="/static/register.css">
    <title>Register</title>

</head>

<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="text-center mt-5">
  <div class="custom-card">
    <h4 class="fw-bold mb-3">Register</h4>

    <form th:action="@{/register}" th:object="${userDto}" method="post" class="needs-validation" novalidate>

      <div class="form-outline mb-3">
        <input type="text" th:field="*{username}" class="form-control" required placeholder="Username">
        <p class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
      </div>

      <div class="form-outline mb-3">
        <input type="password" th:field="*{password}" class="form-control" required placeholder="Password">
        <p class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
      </div>

      <button type="submit" class="btn btn-primary w-100">Register</button>

      <p class="mt-3 small">Already have an account? <a th:href="@{/login}">Login</a></p>

    </form>
  </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>


</body>
</html>
