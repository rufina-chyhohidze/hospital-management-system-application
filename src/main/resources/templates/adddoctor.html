<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Doctor</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/static/style.css}" href="/static/style.css">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/form.css">
    <script src="/static/js/formValid.js" defer></script>
    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
    <link rel="icon" href="/static/favicon/favicon.ico">

</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid px-1 py-5 mx-auto">
    <div class="row d-flex justify-content-center">
        <div class="col-xl-7 col-lg-8 col-md-9 col-11 text-center">
            <div class="card">
                <h5 class="text-center mb-4">Add New Doctor</h5>
                <form th:action="@{/doctors/add}" th:object="${doctorForm}" method="post" class="needs-validation form-card" novalidate>
                    <div class="row justify-content-between text-left">
                        <div class="form-group col-sm-6 flex-column d-flex">
                            <label for="firstName" class="form-control-label px-3">First Name<span class="text-danger"> *</span></label>
                            <input type="text" th:field="*{firstName}" id="firstName" class="form-control" required />
                            <div th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                            <div class="invalid-feedback">First name is required.</div>
                        </div>
                        <div class="form-group col-sm-6 flex-column d-flex">
                            <label for="lastName" class="form-control-label px-3">Last Name<span class="text-danger"> *</span></label>
                            <input type="text" th:field="*{lastName}" id="lastName" class="form-control" required />
                            <div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                            <div class="invalid-feedback">Last name is required.</div>
                        </div>
                    </div>
                    <div class="row justify-content-between text-left">
                        <div class="form-group col-sm-6 flex-column d-flex">
                            <label for="licenseNumber" class="form-control-label px-3">License Number<span class="text-danger"> *</span></label>
                            <input type="text" th:field="*{licenseNumber}" id="licenseNumber" class="form-control" required />
                            <div th:if="${#fields.hasErrors('licenseNumber')}" th:errors="*{licenseNumber}"></div>
                            <div class="invalid-feedback">License number is required.</div>
                        </div>
                        <div class="form-group col-sm-6 flex-column d-flex">
                            <label for="salary" class="form-control-label px-3">Salary<span class="text-danger"> *</span></label>
                            <input type="number" th:field="*{salary}" id="salary" class="form-control" required min="0" />
                            <div th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                            <div class="invalid-feedback">Salary is required and must be a positive value.</div>
                        </div>
                    </div>
                    <div class="row justify-content-between text-left">
                        <div class="form-group col-sm-6 flex-column d-flex">
                            <label for="department" class="form-control-label px-3">Department<span class="text-danger"> *</span></label>
                            <select th:field="*{department}" id="department" class="form-select" required>
                                <option value="" disabled selected>Select Department</option>
                                <option th:each="g : ${T(org.example.programming5project.domain.Department).values()}"
                                        th:value="${g}" th:text="${g.name()}">
                                </option>
                            </select>
                            <div class="invalid-feedback">Please select a department.</div>
                        </div>
                        <div class="form-group col-sm-6 flex-column d-flex">
                            <label for="gender" class="form-control-label px-3">Gender<span class="text-danger"> *</span></label>
                            <select th:field="*{gender}" id="gender" class="form-select" required>
                                <option value="" disabled selected>Select Gender</option>
                                <option th:each="g : ${T(org.example.programming5project.domain.Gender).values()}"
                                        th:value="${g}" th:text="${g.name()}">
                                </option>
                            </select>
                            <div class="invalid-feedback">Please select a gender.</div>
                        </div>
                    </div>
                    <div class="row justify-content-between text-left">
                        <div class="form-group col-12 flex-column d-flex">
                            <label for="hireDate" class="form-control-label px-3">Hire Date<span class="text-danger"> *</span></label>
                            <input type="date" th:field="*{hireDate}" id="hireDate" class="form-control" required />
                            <div th:if="${#fields.hasErrors('hireDate')}" th:errors="*{hireDate}"></div>
                            <div class="invalid-feedback">Hire date is required.</div>
                        </div>
                    </div>
                    <div class="row justify-content-end">
                        <div class="form-group col-sm-6">
                            <button type="submit" class="btn btn-primary btn-block">Add Doctor</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
