<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <meta name="current-user-id" th:content="${#authentication.principal.userId}" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
  <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="/js/bundle-patients.js" defer ></script>
  <script type src="/js/bundle-patient-edit.js" defer></script>

  <link rel="stylesheet" th:href="@{/css/bundle-style.css}" href="/css/bundle-style.css">
  <!-- favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
  <link rel="icon" href="/static/favicon/favicon.ico">
</head>
<body>
<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Main Content -->
<section class="intro">
  <div class="bg-image h-100" style="background-image: url('https://mdbootstrap.com/img/Photos/new-templates/tables/img2.jpg');">
    <div class="mask d-flex align-items-center h-100" style="background-color: rgba(0,0,0,.25);">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12">
            <div class="card bg-dark shadow-2-strong">
              <div class="card-body">
                <h1 class="mb-4 text-white">All Patients</h1>

                <form id="addPatientForm">
                  <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                  <div class="row">
                    <div class="col-md-2">
                      <input type="text" id="firstName" class="form-control" placeholder="First Name" required>
                    </div>
                    <div class="col-md-2">
                      <input type="text" id="lastName" class="form-control" placeholder="Last Name" required>
                    </div>
                    <div class="col-md-1">
                      <input type="number" id="age" class="form-control" placeholder="Age" min="1" required>
                    </div>
                    <div class="col-md-2">
                      <select id="gender" class="form-select" required>
                        <option value="" disabled selected>Select Gender</option>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="OTHER">Other</option>
                      </select>
                    </div>
                    <div class="col-md-2">
                      <input type="date" id="admissionDate" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                      <input type="number" id="billingAmount" class="form-control" placeholder="Billing Amount" min="0" step="0.01" required>
                    </div>
                    <div class="col-md-1">
                      <button type="submit" class="btn btn-success w-100">Add</button>
                    </div>
                  </div>
                  </th:block>
                </form>

                <form th:action="@{/patients/search}" method="get" class="mb-4">
                  <div class="row">
                    <div class="col-md-4">
                      <input type="text" name="name" class="form-control" placeholder="Search by Name">
                    </div>
                    <div class="col-md-4">
                      <input type="date" name="admissionDate" class="form-control" placeholder="Search by Admission Date">
                    </div>
                    <div class="col-md-4">

                      <button type="submit" class="btn btn-primary w-100">Search</button>
                    </div>
                  </div>
                </form>

                <div class="table-responsive">
                  <table class="table table-dark table-borderless mb-0">
                    <thead>
                    <tr>
                      <th scope="col">First Name</th>
                      <th scope="col">Last Name</th>
                      <th scope="col">Age</th>
                      <th scope="col">Gender</th>
                      <th scope="col">Admission Date</th>
                      <th scope="col">Billing Amount</th>
                      <th scope="col">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="patientsTableBody">
                    <tr th:each="patient : ${patients}"
                        th:data-patient-id="${patient.patientId}"
                        th:data-creator-id="${patient.creator.id}">
                      <td th:text="${patient.firstName}">First Name</td>
                      <td th:text="${patient.lastName}">Last Name</td>
                      <td th:text="${patient.age}">Age</td>
                      <td th:text="${patient.gender}">Gender</td>
                      <td th:text="${patient.admissionDate}">Admission Date</td>
                      <td th:text="${patient.billingAmount}">Billing Amount</td>
                      <td>
                        <a th:href="@{/patients/{patientId}(patientId=${patient.patientId})}" class="btn btn-info btn-sm">
                          View Details
                        </a>
                        <!-- Only show for ADMIN -->
                        <button type="button" class="btn btn-danger btn-sm delete-patient-btn"
                                th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                          <i class="bi bi-trash"></i> Delete
                        </button>
                        <button type="button" class="btn btn-warning btn-sm edit-patient-btn"
                                th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                          <i class="bi bi-pencil-square"></i> Edit
                        </button>
                      </td>
                    </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
