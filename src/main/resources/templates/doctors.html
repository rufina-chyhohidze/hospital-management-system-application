<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctors</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/static/style.css}" href="/static/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
    <link rel="icon" href="/static/favicon/favicon.ico">

</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="intro">
    <div class="bg-image h-100" style="background-image: url('https://mdbootstrap.com/img/Photos/new-templates/tables/img2.jpg');">
        <div class="mask d-flex align-items-center h-100" style="background-color: rgba(0,0,0,.25);">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12">
                        <div class="card bg-dark shadow-2-strong">
                            <div class="card-body">
                                <h1 class="text-white mb-4">All Doctors</h1>
                                <!-- Export Button -->
                                <div class="d-flex justify-content-end mb-3">
                                    <button class="btn btn-outline-light btn-sm me-2" onclick="window.location.href='/export/doctors';">
                                        <i class="bi bi-file-earmark-arrow-down"></i> Export Doctors
                                    </button>
                                </div>
                                <form action="/doctors/search" method="get" class="mb-4">
                                    <div class="input-group">
                                        <input type="text" class="form-control" name="licenseNumber" placeholder="Enter License Number" required>
                                        <button class="btn btn-primary" type="submit">Search</button>
                                    </div>
                                </form>
                                <a href="/doctors/add" class="btn btn-primary mb-3">Add New Doctor</a>
                                <div class="table-responsive">
                                    <table class="table table-dark table-borderless mb-0">
                                        <thead>
                                        <tr>
                                            <th scope="col">First Name</th>
                                            <th scope="col">Last Name</th>
                                            <th scope="col">License Number</th>
                                            <th scope="col">Salary</th>
                                            <th scope="col">Department</th>
                                            <th scope="col">Hire Date</th>
                                            <th scope="col">Gender</th>
                                            <th scope="col">Actions</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="doctor : ${doctors}">
                                            <td th:text="${doctor.firstName}">First Name</td>
                                            <td th:text="${doctor.lastName}">Last Name</td>
                                            <td th:text="${doctor.licenseNumber}">License Number</td>
                                            <td th:text="${doctor.salary}">Salary</td>
                                            <td th:text="${doctor.department}">Department</td>
                                            <td th:text="${doctor.hireDate}">Hire Date</td>
                                            <td th:text="${doctor.gender}">Gender</td>
                                            <td>
                                                <a th:href="@{/doctors/{licenseNumber}(licenseNumber=${doctor.licenseNumber})}" class="btn btn-info">View Details</a>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
